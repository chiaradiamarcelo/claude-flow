# Experiment-local JVM pin. Overrides the user's global ~/.gradle/gradle.properties
# which points org.gradle.java.home at Android Studio's JBR (Java 21). PIT's forked
# coverage minion crashes under the JBR, so we use a plain Temurin JDK instead.
# Bytecode is targeted at 21 (see build.gradle.kts) so PIT's ASM 9.7.1 can read it.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home
